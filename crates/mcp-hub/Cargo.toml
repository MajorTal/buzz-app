[package]
name = "buzz-mcp-hub"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Stdio MCP server for local agents: buzz-dev-mcp plus the agent's connected apps"

[[bin]]
name = "buzz-mcp-hub"
path = "src/main.rs"

[dependencies]
buzz-agent-controller = { path = "../agent-controller" }
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
