<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dragging tab</title>
    <style>
      /* Mirrors the selected .shell-tab. Color roles are copied from
         src/shared/styles/tokens.css because this page cannot load the bundle. */
      :root {
        color-scheme: light;
        --text: #242e31;
        --surface: #ffffff;
        --border: #e8e9e7;
        --elevation-popover: 0 8px 32px #202c3220;
      }
      :root[data-color-mode="dark"] {
        color-scheme: dark;
        --text: #e6edf0;
        --surface: #1b252b;
        --border: #384b56;
        --elevation-popover: 0 8px 32px #0009;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      body {
        padding: 4px 6px 6px;
        box-sizing: border-box;
      }
      #tab {
        display: flex;
        align-items: center;
        height: 100%;
        padding: 0 16px;
        box-sizing: border-box;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        font-size: calc(0.875rem * var(--buzz-text-scale, 1));
        line-height: 1;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        box-shadow: var(--elevation-popover);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <div id="tab"></div>
  </body>
  <script src="/drag-ghost.js"></script>
</html>
