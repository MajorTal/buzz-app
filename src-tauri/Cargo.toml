[package]
name = "buzz-foundation"
version = "0.0.0"
description = "Buzz application foundation"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "buzz_foundation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
buzzodz-plugins = { path = "../crates/plugin-manager" }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
serde_json = "1"
zeroize = "1.9"
secp256k1 = { version = "0.31", default-features = false, features = ["std"] }
bech32 = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(unix)'.dependencies]
portable-pty = "0.9"
libc = "0.2"
